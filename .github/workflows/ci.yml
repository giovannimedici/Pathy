# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: "**"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test with coverage
        run: |
          dotnet test --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Cobertura;TextSummary"

      - name: Verify Endpoints coverage per class (min 70%)
        run: |
          echo "Checking coverage for each Endpoints class..."
          
          # Parse Cobertura.xml for Endpoints classes and save to temp file
          rm -f /tmp/endpoints_coverage.txt /tmp/endpoints_failed.txt
          grep '<class name="Pathy\.API\.Endpoints\.' ./coverage/report/Cobertura.xml | while read -r line; do
            CLASS_NAME=$(echo "$line" | sed -n 's/.*<class name="\([^"]*\)".*/\1/p')
            LINE_RATE=$(echo "$line" | awk -F'line-rate="' '{print $2}' | awk -F'"' '{print $1}')
            
            if [ -n "$CLASS_NAME" ] && [ -n "$LINE_RATE" ]; then
              COVERAGE_PCT=$(awk "BEGIN {printf \"%.1f\", $LINE_RATE * 100}")
              SHORT_NAME="${CLASS_NAME##*.}"
              echo "${SHORT_NAME}:${COVERAGE_PCT}" >> /tmp/endpoints_coverage.txt
            fi
          done
          
          if [ ! -f /tmp/endpoints_coverage.txt ]; then
            echo "::error::No Endpoints classes found in coverage report"
            exit 1
          fi
          
          echo "=== Endpoints Coverage Results ==="
          while IFS=: read -r NAME PCT; do
            BELOW=$(awk "BEGIN {print ($PCT < 70) ? 1 : 0}")
            if [ "$BELOW" -eq 1 ]; then
              echo "::error::❌ ${NAME}: ${PCT}% (below 70%)"
              echo "FAILED" >> /tmp/endpoints_failed.txt
            else
              echo "✅ ${NAME}: ${PCT}%"
            fi
          done < /tmp/endpoints_coverage.txt
          
          if [ -f /tmp/endpoints_failed.txt ]; then
            rm -f /tmp/endpoints_coverage.txt /tmp/endpoints_failed.txt
            echo "::error::One or more Endpoints classes are below the 70% coverage threshold"
            exit 1
          fi
          
          rm -f /tmp/endpoints_coverage.txt
          echo "All Endpoints classes meet the 70% coverage threshold"

      - name: Verify UseCases coverage per class (min 70%)
        run: |
          echo "Checking coverage for each UseCase class..."
          
          # Parse Cobertura.xml for UseCase classes and save to temp file
          rm -f /tmp/usecases_coverage.txt /tmp/usecases_failed.txt
          grep '<class name="Pathy\.Application\.ShortLinks\.UseCases\.' ./coverage/report/Cobertura.xml | grep 'UseCase"' | while read -r line; do
            CLASS_NAME=$(echo "$line" | sed -n 's/.*<class name="\([^"]*\)".*/\1/p')
            LINE_RATE=$(echo "$line" | awk -F'line-rate="' '{print $2}' | awk -F'"' '{print $1}')
            
            if [ -n "$CLASS_NAME" ] && [ -n "$LINE_RATE" ]; then
              COVERAGE_PCT=$(awk "BEGIN {printf \"%.1f\", $LINE_RATE * 100}")
              SHORT_NAME="${CLASS_NAME##*.}"
              echo "${SHORT_NAME}:${COVERAGE_PCT}" >> /tmp/usecases_coverage.txt
            fi
          done
          
          if [ ! -f /tmp/usecases_coverage.txt ]; then
            echo "::error::No UseCase classes found in coverage report"
            exit 1
          fi
          
          echo "=== UseCases Coverage Results ==="
          while IFS=: read -r NAME PCT; do
            BELOW=$(awk "BEGIN {print ($PCT < 70) ? 1 : 0}")
            if [ "$BELOW" -eq 1 ]; then
              echo "::error::❌ ${NAME}: ${PCT}% (below 70%)"
              echo "FAILED" >> /tmp/usecases_failed.txt
            else
              echo "✅ ${NAME}: ${PCT}%"
            fi
          done < /tmp/usecases_coverage.txt
          
          if [ -f /tmp/usecases_failed.txt ]; then
            rm -f /tmp/usecases_coverage.txt /tmp/usecases_failed.txt
            echo "::error::One or more UseCase classes are below the 70% coverage threshold"
            exit 1
          fi
          
          rm -f /tmp/usecases_coverage.txt
          echo "All UseCase classes meet the 70% coverage threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage/report/
