# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: "**"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test with coverage
        run: |
          dotnet test --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Cobertura;TextSummary"

      - name: Verify Endpoints coverage (min 70%)
        run: |
          COVERAGE=$(grep -A1 'Pathy\.API\.Endpoints' ./coverage/report/Cobertura.xml | grep -oP 'line-rate="\K[0-9.]+' | head -1)
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not find coverage data for Pathy.API.Endpoints namespace"
            exit 1
          fi
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)
          echo "Endpoints line coverage: ${COVERAGE_PCT}%"
          if (( $(echo "$COVERAGE_PCT < 70" | bc -l) )); then
            echo "::error::Endpoints coverage ${COVERAGE_PCT}% is below the required 70%"
            exit 1
          fi
          echo "✅ Endpoints coverage ${COVERAGE_PCT}% meets the 70% threshold"

      - name: Verify UseCases coverage (min 70%)
        run: |
          COVERAGE=$(grep -A1 'Pathy\.Application\.ShortLinks\.UseCases' ./coverage/report/Cobertura.xml | grep -oP 'line-rate="\K[0-9.]+' | head -1)
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not find coverage data for Pathy.Application.ShortLinks.UseCases namespace"
            exit 1
          fi
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)
          echo "UseCases line coverage: ${COVERAGE_PCT}%"
          if (( $(echo "$COVERAGE_PCT < 70" | bc -l) )); then
            echo "::error::UseCases coverage ${COVERAGE_PCT}% is below the required 70%"
            exit 1
          fi
          echo "✅ UseCases coverage ${COVERAGE_PCT}% meets the 70% threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage/report/
