# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: "**"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test with coverage
        run: |
          dotnet test --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Cobertura;TextSummary"

      - name: Verify Endpoints coverage per class (min 70%)
        run: |
          echo "Checking coverage for each Endpoints class..."
          FAILED=0
          
          # Extract all classes matching Pathy.API.Endpoints.* and their line-rate
          while IFS= read -r line; do
            CLASS_NAME=$(echo "$line" | grep -oP 'name="\K[^"]+')
            LINE_RATE=$(echo "$line" | grep -oP 'line-rate="\K[0-9.]+')
            
            if [[ "$CLASS_NAME" == Pathy.API.Endpoints.* ]]; then
              COVERAGE_PCT=$(echo "$LINE_RATE * 100" | bc)
              SHORT_NAME="${CLASS_NAME##*.}"
              
              if (( $(echo "$COVERAGE_PCT < 70" | bc -l) )); then
                echo "::error::❌ ${SHORT_NAME}: ${COVERAGE_PCT}% (below 70%)"
                FAILED=1
              else
                echo "✅ ${SHORT_NAME}: ${COVERAGE_PCT}%"
              fi
            fi
          done < <(grep -E '<class[^>]+name="Pathy\.API\.Endpoints\.' ./coverage/report/Cobertura.xml)
          
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more Endpoints classes are below the 70% coverage threshold"
            exit 1
          fi
          echo "All Endpoints classes meet the 70% coverage threshold"

      - name: Verify UseCases coverage per class (min 70%)
        run: |
          echo "Checking coverage for each UseCase class..."
          FAILED=0
          
          # Extract all classes matching *UseCase and their line-rate
          while IFS= read -r line; do
            CLASS_NAME=$(echo "$line" | grep -oP 'name="\K[^"]+')
            LINE_RATE=$(echo "$line" | grep -oP 'line-rate="\K[0-9.]+')
            
            if [[ "$CLASS_NAME" == Pathy.Application.ShortLinks.UseCases.*UseCase ]]; then
              COVERAGE_PCT=$(echo "$LINE_RATE * 100" | bc)
              SHORT_NAME="${CLASS_NAME##*.}"
              
              if (( $(echo "$COVERAGE_PCT < 70" | bc -l) )); then
                echo "::error::❌ ${SHORT_NAME}: ${COVERAGE_PCT}% (below 70%)"
                FAILED=1
              else
                echo "✅ ${SHORT_NAME}: ${COVERAGE_PCT}%"
              fi
            fi
          done < <(grep -E '<class[^>]+name="Pathy\.Application\.ShortLinks\.UseCases\.[^"]*UseCase"' ./coverage/report/Cobertura.xml)
          
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more UseCase classes are below the 70% coverage threshold"
            exit 1
          fi
          echo "All UseCase classes meet the 70% coverage threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage/report/
